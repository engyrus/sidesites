<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B30FF"/>
      <stop offset="55%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A00B4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frontCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE8FF"/>
    </linearGradient>
    <filter id="backShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#12083B" flood-opacity="0.38"/>
    </filter>
    <filter id="frontShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="-4" dy="5" stdDeviation="4" flood-color="#12083B" flood-opacity="0.48"/>
    </filter>
  </defs>

  <!-- Rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>

  <!-- Back card (main browser window) -->
  <g filter="url(#backShadow)">
    <rect x="18" y="30" width="76" height="68" rx="12" fill="#FFFFFF" fill-opacity="0.26" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="30" cy="41" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="40" cy="41" r="3" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="50" cy="41" r="3" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>

  <!-- Front card (elevated side panel) -->
  <g filter="url(#frontShadow)">
    <rect x="66" y="22" width="44" height="84" rx="12" fill="url(#frontCard)"/>
    <!-- Accent bar & content lines -->
    <rect x="74" y="34" width="28" height="8" rx="4" fill="#7B1FA2"/>
    <rect x="74" y="50" width="22" height="6" rx="3" fill="#B388FF"/>
    <rect x="74" y="62" width="28" height="6" rx="3" fill="#D1B3FF"/>
    <rect x="74" y="74" width="18" height="6" rx="3" fill="#D1B3FF"/>
    <!-- Subtle sparkle/star accent -->
    <path d="M98 86 L99.8 90.2 L104 92 L99.8 93.8 L98 98 L96.2 93.8 L92 92 L96.2 90.2 Z" fill="#FFB300"/>
  </g>
</svg>
